version = 1
revision = 3
requires-python = ">=3.12"

[[package]]
name = "annotated-doc"
version = "0.0.5"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "annotated-types"
version = "0.8.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "anyio"
version = "4.15.1"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "idna" },
    { name = "typing-extensions", marker = "python_full_version < '3.15'" },
]

[[package]]
name = "arcloom"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "falkordb" },
    { name = "fastapi" },
    { name = "httpx" },
    { name = "pydantic" },
    { name = "pydantic-settings" },
    { name = "uvicorn" },
]

[package.optional-dependencies]
dev = [
    { name = "hypothesis" },
    { name = "pytest" },
    { name = "pytest-cov" },
    { name = "ruff" },
]
lite = [
    { name = "falkordblite" },
]

[package.metadata]
requires-dist = [
    { name = "falkordb", specifier = "==1.8.0" },
    { name = "falkordblite", marker = "extra == 'lite'", specifier = "==0.10.0" },
    { name = "fastapi", specifier = "==0.143.3" },
    { name = "httpx", specifier = "==0.28.1" },
    { name = "hypothesis", marker = "extra == 'dev'", specifier = "==6.170.1" },
    { name = "pydantic", specifier = "==2.14.1" },
    { name = "pydantic-settings", specifier = "==2.16.0" },
    { name = "pytest", marker = "extra == 'dev'", specifier = "==9.1.1" },
    { name = "pytest-cov", marker = "extra == 'dev'", specifier = "==7.1.0" },
    { name = "ruff", marker = "extra == 'dev'", specifier = "==0.17.1" },
    { name = "uvicorn", specifier = "==0.54.0" },
]
provides-extras = ["lite", "dev"]

