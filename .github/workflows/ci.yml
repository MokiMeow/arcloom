name: Arcloom validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arcloom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.19
          uv sync --frozen --extra dev --extra lite
          npm --prefix apps/web ci
      - name: Lint and format
        run: |
          uv run --frozen --extra dev --extra lite ruff check src tests scripts
          uv run --frozen --extra dev --extra lite ruff format --check src tests scripts
          npm --prefix apps/web run format:check
      - name: Backend and actual FalkorDB integration
        env:
          ARCLOOM_TEST_GRAPH: lite
        run: uv run --frozen --extra dev --extra lite pytest -q --cov=arcloom --cov-report=xml --junitxml=test-results/backend.xml
      - name: Frontend contracts and production build
        run: |
          npm --prefix apps/web run typecheck
          npm --prefix apps/web test
          npm --prefix apps/web run build
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Full browser scenarios
        run: ARCLOOM_TEST_PYTHON="$PWD/.venv/bin/python" npm --prefix apps/web run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: arcloom-validation
          path: |
            test-results/
            apps/web/test-results/
            coverage.xml
          retention-days: 7
