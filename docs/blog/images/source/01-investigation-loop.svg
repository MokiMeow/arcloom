<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1060" viewBox="0 0 1360 1060" role="img" aria-label="Arcloom investigation loop: report, human approval, bounded runner, human review, FalkorDB memory, fresh process proposal back to approval">
<title>Arcloom investigation loop: report, human approval, bounded runner, human review, FalkorDB memory, fresh process proposal back to approval</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#1f3029"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#b54b2a"/></marker></defs>
<rect width="1360" height="1060" fill="#f6f3ec"/>
<text x="60" y="78" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#1f3029" text-anchor="start">One loop, two human checkpoints</text>
<text x="60" y="120" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#5b6a61" text-anchor="start">A fresh process can propose. Only people approve execution and accept evidence.</text>
<rect x="60" y="170" width="500" height="210" rx="16" fill="#ffffff" stroke="#5b6a61" stroke-width="3"/>
<text x="86" y="214" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" fill="#5b6a61" text-anchor="start">1 · REPORT</text>
<text x="86" y="256" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#1f3029" text-anchor="start">A claim, not a finding</text>
<text x="86" y="296" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#5b6a61" text-anchor="start">Registered synthetic test,</text>
<text x="86" y="330" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#5b6a61" text-anchor="start">original researcher kept</text>
<rect x="640" y="170" width="500" height="210" rx="16" fill="#ffffff" stroke="#b54b2a" stroke-width="3"/>
<text x="666" y="214" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" fill="#b54b2a" text-anchor="start">2 · HUMAN APPROVAL</text>
<text x="666" y="256" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#1f3029" text-anchor="start">Authorize one test</text>
<text x="666" y="296" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#5b6a61" text-anchor="start">Scope, revision, budget</text>
<text x="666" y="330" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#5b6a61" text-anchor="start">rechecked before running</text>
<rect x="640" y="450" width="500" height="210" rx="16" fill="#ffffff" stroke="#1f3029" stroke-width="3"/>
<text x="666" y="494" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" fill="#1f3029" text-anchor="start">3 · BOUNDED RUNNER</text>
<text x="666" y="536" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#1f3029" text-anchor="start">Real HTTP observations</text>
<text x="666" y="576" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#5b6a61" text-anchor="start">Signed receipt and</text>
<text x="666" y="610" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#5b6a61" text-anchor="start">SHA-256 evidence digest</text>
<rect x="60" y="450" width="500" height="210" rx="16" fill="#ffffff" stroke="#b54b2a" stroke-width="3"/>
<text x="86" y="494" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" fill="#b54b2a" text-anchor="start">4 · HUMAN REVIEW</text>
<text x="86" y="536" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#1f3029" text-anchor="start">Review the evidence</text>
<text x="86" y="576" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#5b6a61" text-anchor="start">Negative and inconclusive</text>
<text x="86" y="610" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#5b6a61" text-anchor="start">results stay in memory</text>
<rect x="60" y="730" width="500" height="210" rx="16" fill="#ffffff" stroke="#2f6b55" stroke-width="3"/>
<text x="86" y="774" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" fill="#2f6b55" text-anchor="start">5 · FALKORDB MEMORY</text>
<text x="86" y="816" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#1f3029" text-anchor="start">Finding ENABLES capability</text>
<text x="86" y="856" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#5b6a61" text-anchor="start">Current, confirmed,</text>
<text x="86" y="890" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#5b6a61" text-anchor="start">revision-scoped support</text>
<rect x="640" y="730" width="500" height="210" rx="16" fill="#ffffff" stroke="#a8792f" stroke-width="3"/>
<text x="666" y="774" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" fill="#a8792f" text-anchor="start">6 · FRESH PROCESS</text>
<text x="666" y="816" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#1f3029" text-anchor="start">Proposes the next test</text>
<text x="666" y="856" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#5b6a61" text-anchor="start">No previous messages;</text>
<text x="666" y="890" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#5b6a61" text-anchor="start">graph-backed candidates</text>
<line x1="560" y1="275" x2="632" y2="275" stroke="#1f3029" stroke-width="3" marker-end="url(#a)"/>
<line x1="890.0" y1="380" x2="890.0" y2="442" stroke="#1f3029" stroke-width="3" marker-end="url(#a)"/>
<line x1="640" y1="555" x2="568" y2="555" stroke="#1f3029" stroke-width="3" marker-end="url(#a)"/>
<line x1="310.0" y1="660" x2="310.0" y2="722" stroke="#1f3029" stroke-width="3" marker-end="url(#a)"/>
<line x1="560" y1="835" x2="632" y2="835" stroke="#1f3029" stroke-width="3" marker-end="url(#a)"/>
<defs><marker id="return-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#b54b2a"/></marker></defs>
<path d="M 1148 835 H 1240 Q 1260 835 1260 815 V 295 Q 1260 275 1240 275 H 1150" fill="none" stroke="#b54b2a" stroke-width="3" stroke-dasharray="8 7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#return-arrow)"/>
<rect x="1188" y="493" width="144" height="66" rx="12" fill="#f6f3ec" stroke="#d8d4c8" stroke-width="1"/>
<text x="1260" y="519" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#b54b2a" text-anchor="middle">Next proposal</text>
<text x="1260" y="542" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5b6a61" text-anchor="middle">back to step 2</text>
<text x="680" y="1010" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#5b6a61" text-anchor="middle">The proposal re-enters at step 2: a supported candidate is a reason to ask, not permission to run.</text>
</svg>
